name: Compile public native sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: ARM32, Windows x64 and Android ARM64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up portable Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Provide the pinned wheel set to the test job
        run: >-
          python -m pip install --disable-pip-version-check
          capstone==5.0.9 pycryptodomex==3.24.2 pyctr==0.7.6 pyelftools==0.33
          unicorn==2.1.4 z3-solver==5.3.3.0 cvc5==1.4.2
      - name: Materialize only pinned public compiler files
        run: python -I -S toolscripts/bootstrap_public_compiler.py
      - name: Cache the pinned original compiler archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tools/downloads/armcc.zip
          key: armcc-4.1-b1454-bda0cea5b13a9c3f
      - name: Materialize the pinned original compiler
        run: python -I -S toolscripts/armcc_bootstrap.py
      - name: Run the test suite
        run: python -I -m unittest discover -s tests -v
      - name: Compile the native units with the build's compiler profile
        run: python -I toolscripts/compile_measured_units.py
      - name: Compile native sources and bounded VM components for reviewed targets
        run: python -I -S toolscripts/compile_sources.py
      - name: Upload compile diagnostics and manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-compile-diagnostics
          path: |
            work/source-compile-ci/diagnostics/*.txt
            work/source-compile-ci/manifests/*.json
          if-no-files-found: warn
          retention-days: 7
