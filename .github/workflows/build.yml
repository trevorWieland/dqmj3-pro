name: Build the reconstructed game from private originals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'trevorWieland/dqmj3-pro' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout reconstruction source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up bootstrap Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check frozen Python archive boundaries
        run: python -I -S -m unittest discover -s tests -p test_bootstrap_report_python.py -v
      - name: Materialize project-local frozen Python
        run: python -I -S toolscripts/bootstrap_report_python.py
      - name: Check generated source-link names
        run: tools/ci-python-3.13.5/python.exe -I -S toolscripts/generate_source_names.py --check
      - name: Check frozen public download integrity and retries
        run: tools/ci-python-3.13.5/python.exe -I -S -m unittest discover -s tests -p test_bootstrap_report_tools.py -v
      - name: Check pinned compiler and report tool installation
        run: tools/ci-python-3.13.5/python.exe -I -S toolscripts/bootstrap_report_tools.py
      - name: Materialize the pinned public compiler
        run: tools/ci-python-3.13.5/python.exe -I -S toolscripts/bootstrap_public_compiler.py
      - name: Checkout owner-controlled private input parts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: trevorWieland/dqmj3-pro-inputs
          ssh-key: ${{ secrets.INPUTS_DEPLOY_KEY }}
          persist-credentials: false
          path: work/private-inputs
      - name: Build the game and its progress report
        run: tools/report-python/Scripts/python.exe -I build.py --private-inputs work/private-inputs
      - name: Check the report against the ExHeader, the link and the split
        run: tools/report-python/Scripts/python.exe -I toolscripts/check_report.py
      - name: Upload the progress report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: update-content0_report
          path: build/update-content0/report.json
          if-no-files-found: error
